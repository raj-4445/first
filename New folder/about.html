<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | Project Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none; /* Removes the default underline */
            border-radius: 5px;
            font-weight: bold;
        }
        a:hover {
            background-color: #2980b9; /* Darkens the button when hovered */
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>About the Project</h1>
        <p>This is the second page of your website. You can put details, documentation, or contact information here.</p>
        
        <!-- This is the link back to the homepage -->
        <a href="index.html">← Back to Dashboard</a>
    </div>

</body>
</html>
